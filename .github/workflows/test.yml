name: Node.js CI

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3. Instalar dependencias (incluyendo devDependencies)
      - name: Install dependencies
        run: npm ci --include=dev

      # 4. Ejecutar tests
      - name: Run tests
        run: npx --no-install mocha --exit
